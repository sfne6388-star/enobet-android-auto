name: Android Auto Test Paketi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi al
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Paketleri al
        run: flutter pub get

      - name: Android Auto icin AAB olustur
        run: flutter build appbundle --release

      - name: Android Auto AAB yukle
        uses: actions/upload-artifact@v4
        with:
          name: ENobet-Android-Auto-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
