name: enobet

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.2.3

  mobile_scanner: ^7.4.1

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  http: ^1.5.0
  geolocator: ^14.0.3
  geocoding: ^4.0.0
  shared_preferences: ^2.5.3
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

  flutter_map: ^8.2.2
  flutter_local_notifications: ^22.3.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/enobet_splash_icon.png
    - assets/data/turkiye_hizmetleri.json
    - assets/data/yol_hizmetleri.json
    - assets/data/avmler.json
    - assets/data/avm_magazalari.json
