name: Android Auto Test Paketi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi al
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Paketleri al
        run: flutter pub get

      - name: Eczane API anahtarini kontrol et
        env:
          TEKNIKZEKA_API_KEY: ${{ secrets.TEKNIKZEKA_API_KEY }}
        run: |
          if [ -z "$TEKNIKZEKA_API_KEY" ]; then
            echo "HATA: TEKNIKZEKA_API_KEY GitHub Secret bulunamadi."
            exit 1
          fi

      - name: Android Auto icin AAB olustur
        env:
          TEKNIKZEKA_API_KEY: ${{ secrets.TEKNIKZEKA_API_KEY }}
        run: >-
          flutter build appbundle --release
          --dart-define=TEKNIKZEKA_API_KEY="$TEKNIKZEKA_API_KEY"

      - name: Android Auto AAB yukle
        uses: actions/upload-artifact@v4
        with:
          name: ENobet-Android-Auto-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
